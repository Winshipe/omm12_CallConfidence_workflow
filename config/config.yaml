# ---------------------------------------------------------------------------
# config/config.yaml  — edit this file to customise your run
# ---------------------------------------------------------------------------

# ── References ──────────────────────────────────────────────────────────────
# Keys are short IDs used throughout the pipeline.
references:
  ref_A: "resources/references/ref_A.fasta"
  ref_B: "resources/references/ref_B.fasta"

# ── Mutation model ──────────────────────────────────────────────────────────
mutation:
  model: "tamura_nei"          # "jukes_cantor" | "tamura_nei"
  substitution_rate: 0.001     # per-site substitution rate
  # Tamura-Nei-specific parameters (ignored for Jukes-Cantor)
  kappa: 2.0                   # transition / transversion ratio
  gc_freq: 0.5                 # equilibrium GC frequency (pi_G + pi_C)
  seed: 42

# ── Annotation ───────────────────────────────────────────────────────────────
annotation:
  mmseqs_databases:
    - "resources/databases/ISfinder_mmseqs"
    - "resources/databases/Dfam_TE_mmseqs"
  mmseqs_sensitivity: 7.5      # -s flag
  mmseqs_evalue: 1.0e-5
  threads: 8

# ── Read simulation (ART) ────────────────────────────────────────────────────
simulation:
  platform: "MSv3"             # ART sequencing platform/instrument
  read_length: 150
  mean_fragment_length: 400
  std_fragment_length: 50
  coverage: 50                 # fold coverage per reference
  # Optional: supply real reads to learn error profile from
  # Leave as null to use ART built-in MiSeq profile.
  empirical_reads_R1: null     # "resources/empirical/real_R1.fastq.gz"
  empirical_reads_R2: null     # "resources/empirical/real_R2.fastq.gz"
  seed: 42
  threads: 4

# ── Read blending ────────────────────────────────────────────────────────────
# Each scenario is a list of contributions: {ref_id, mutated_fraction, abundance}
# abundances are relative (normalised internally).
scenarios:
  scenario_equal_mix:
    - ref_id: ref_A
      mutated_fraction: 0.5    # fraction of reads drawn from mutated version
      abundance: 1.0
    - ref_id: ref_B
      mutated_fraction: 0.5
      abundance: 1.0

  scenario_rare_mutant:
    - ref_id: ref_A
      mutated_fraction: 0.05
      abundance: 1.0
    - ref_id: ref_B
      mutated_fraction: 0.0
      abundance: 1.0

  scenario_single_ref:
    - ref_id: ref_A
      mutated_fraction: 1.0
      abundance: 1.0

# Total read pairs to produce per blended scenario
blend_total_reads: 1000000

# ── Variant calling (breseq) ─────────────────────────────────────────────────
variant_calling:
  breseq_extra_flags: ""       # e.g. "--polymorphism-prediction"
  threads: 8

# ── Assessment ───────────────────────────────────────────────────────────────
assessment:
  min_quality: 20              # minimum breseq quality to consider a call
